name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test -- --runInBand

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Validar secrets obrigatórios
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "❌ Secret ausente/vazio: VPS_HOST (use IP ou domínio, sem porta)"
            exit 1
          fi

          if [ -z "${{ secrets.VPS_USER }}" ]; then
            echo "❌ Secret ausente/vazio: VPS_USER (ex: whatsapp)"
            exit 1
          fi

          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "❌ Secret ausente/vazio: VPS_SSH_KEY (chave privada SSH)"
            exit 1
          fi

          echo "✅ Secrets presentes (host/user/key)"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: /home/whatsapp/deploy.sh
