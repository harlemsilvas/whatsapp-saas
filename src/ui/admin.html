<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin • Inbox</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #081018;
      --bg-elevated: #0d1722;
      --bg-soft: #12202d;
      --bg-accent: #1a2d3d;
      --border: #223649;
      --border-strong: #33506b;
      --text: #ebf3fb;
      --text-muted: #94a9bc;
      --success: #5fd1a2;
      --warning: #f1ca63;
      --danger: #ff8795;
      --info: #73c2ff;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.32);
    }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(68, 129, 196, 0.22), transparent 28%),
        radial-gradient(circle at top right, rgba(95, 209, 162, 0.18), transparent 24%),
        linear-gradient(180deg, #06111a 0%, #081018 100%);
    }

    header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(6, 15, 24, 0.82);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    main {
      display: grid;
      grid-template-columns: 360px 1fr;
      height: calc(100vh - 58px);
    }

    .col {
      overflow: auto;
    }

    .left {
      border-right: 1px solid var(--border);
      display: grid;
      grid-template-rows: auto minmax(220px, 42%) 1fr;
      background: rgba(9, 17, 26, 0.72);
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    label {
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.03em;
    }

    input {
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      color: var(--text);
      background: var(--bg-soft);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    input::placeholder {
      color: #6f8598;
    }

    button {
      padding: 8px 12px;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      background: linear-gradient(180deg, #163047 0%, #122536 100%);
      color: var(--text);
      cursor: pointer;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: #4f7aa0;
      background: linear-gradient(180deg, #1a3953 0%, #153047 100%);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .list {
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .item {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(34, 54, 73, 0.72);
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease;
    }

    .item:hover {
      background: rgba(26, 45, 61, 0.42);
    }

    .item.active {
      background: linear-gradient(90deg, rgba(40, 74, 102, 0.8) 0%, rgba(20, 35, 49, 0.8) 100%);
      box-shadow: inset 3px 0 0 #73c2ff;
    }

    .muted {
      color: var(--text-muted);
      font-size: 12px;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      font-size: 12px;
      background: rgba(19, 33, 46, 0.88);
      color: var(--text);
    }

    .badge.status-failed {
      border-color: rgba(255, 135, 149, 0.7);
      background: rgba(88, 26, 37, 0.9);
      color: #ffd4da;
    }

    .badge.status-processing {
      border-color: rgba(115, 194, 255, 0.7);
      background: rgba(23, 52, 78, 0.92);
      color: #d9f0ff;
    }

    .badge.status-pending {
      border-color: rgba(241, 202, 99, 0.68);
      background: rgba(73, 58, 18, 0.92);
      color: #fff3c2;
    }

    .badge.status-sent {
      border-color: rgba(95, 209, 162, 0.62);
      background: rgba(20, 63, 50, 0.92);
      color: #d7fff0;
    }

    .badge.meta-sent {
      border-color: rgba(115, 194, 255, 0.58);
      background: rgba(18, 46, 69, 0.9);
      color: #d8efff;
    }

    .badge.meta-delivered {
      border-color: rgba(95, 209, 162, 0.62);
      background: rgba(16, 70, 53, 0.92);
      color: #d6fff1;
    }

    .badge.meta-read {
      border-color: rgba(171, 125, 255, 0.62);
      background: rgba(52, 33, 86, 0.92);
      color: #eee2ff;
    }

    .badge.meta-failed {
      border-color: rgba(255, 135, 149, 0.7);
      background: rgba(88, 26, 37, 0.9);
      color: #ffd4da;
    }

    .chat {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background:
        linear-gradient(180deg, rgba(10, 18, 28, 0.84) 0%, rgba(8, 16, 24, 0.98) 100%);
    }

    .msg {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      max-width: 720px;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: var(--shadow);
    }

    .msg.in {
      align-self: flex-start;
      background: linear-gradient(180deg, #132432 0%, #10202c 100%);
    }

    .msg.out {
      align-self: flex-end;
      background: linear-gradient(180deg, #12372d 0%, #0f2e26 100%);
      border-color: rgba(95, 209, 162, 0.32);
    }

    .compose {
      margin-top: auto;
      border-top: 1px solid var(--border);
      padding: 12px;
      display: flex;
      gap: 8px;
      background: rgba(8, 16, 24, 0.96);
    }

    .compose input {
      flex: 1;
    }

    .error {
      color: var(--danger);
      font-size: 12px;
    }

    .panel {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      margin-top: 12px;
      background: linear-gradient(180deg, rgba(14, 25, 37, 0.98) 0%, rgba(10, 19, 28, 0.98) 100%);
      box-shadow: var(--shadow);
    }

    .panel h3 {
      margin: 0 0 8px;
      font-size: 14px;
      letter-spacing: 0.02em;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .outbox-item {
      border-top: 1px solid rgba(34, 54, 73, 0.72);
      padding: 8px 0;
    }

    .outbox-item:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .outbox-meta {
      margin-top: 6px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .status-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 6px;
    }

    .timeline-line {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .timeline-pill {
      font-size: 11px;
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(15, 27, 39, 0.9);
      border: 1px solid rgba(51, 80, 107, 0.72);
    }

    .section-title {
      padding: 10px 12px 0;
      font-size: 12px;
      color: #7f97aa;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .section-body {
      padding: 0 12px 12px;
      overflow: auto;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }

    .summary-card {
      border: 1px solid rgba(51, 80, 107, 0.72);
      border-radius: 12px;
      padding: 8px;
      background: linear-gradient(180deg, rgba(18, 32, 45, 0.95) 0%, rgba(14, 25, 37, 0.95) 100%);
    }

    .summary-card strong {
      display: block;
      font-size: 18px;
      margin-bottom: 2px;
    }

    .filter-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .filter-chip {
      padding: 6px 10px;
      font-size: 12px;
    }

    .filter-chip.active {
      background: linear-gradient(180deg, #214763 0%, #1b3448 100%);
      color: #fff;
      border-color: #73c2ff;
    }

    .outbox-global-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      margin-bottom: 8px;
      background: linear-gradient(180deg, rgba(17, 29, 40, 0.98) 0%, rgba(13, 23, 34, 0.98) 100%);
    }

    .outbox-global-item.failed {
      border-color: rgba(255, 135, 149, 0.6);
      background: linear-gradient(180deg, rgba(60, 22, 31, 0.92) 0%, rgba(33, 15, 20, 0.96) 100%);
    }

    .outbox-global-item.processing {
      border-color: rgba(115, 194, 255, 0.6);
      background: linear-gradient(180deg, rgba(19, 41, 64, 0.92) 0%, rgba(13, 27, 42, 0.96) 100%);
    }

    .outbox-global-item.pending {
      border-color: rgba(241, 202, 99, 0.58);
      background: linear-gradient(180deg, rgba(59, 48, 18, 0.92) 0%, rgba(32, 26, 12, 0.96) 100%);
    }

    .outbox-global-item.sent {
      border-color: rgba(95, 209, 162, 0.46);
      background: linear-gradient(180deg, rgba(18, 55, 45, 0.92) 0%, rgba(11, 31, 26, 0.96) 100%);
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(90, 122, 150, 0.46);
      border-radius: 999px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(8, 16, 24, 0.2);
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
        height: auto;
      }

      .left {
        grid-template-rows: auto auto auto;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .chat {
        min-height: 50vh;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="row">
      <div>
        <label>API Key</label><br />
        <input id="apiKey" type="password" placeholder="x-api-key" size="22" />
      </div>
      <div>
        <label>Empresa ID</label><br />
        <input id="empresaId" type="number" min="1" placeholder="1" size="6" />
      </div>
      <div style="padding-top: 18px">
        <button id="btnLoad">Carregar</button>
      </div>
      <div id="status" class="muted"></div>
    </div>
    <div class="row" style="margin-top: 10px">
      <div>
        <label>Novo telefone</label><br />
        <input id="newTelefone" type="tel" placeholder="(11) 99999-9999" size="22" />
      </div>
      <div>
        <label>Novo nome</label><br />
        <input id="newNome" type="text" placeholder="Ex.: João" size="18" />
      </div>
      <div>
        <label>Tags (separadas por vírgula)</label><br />
        <input id="newTags" type="text" placeholder="vip, orçamento" size="22" />
      </div>
      <div style="padding-top: 18px">
        <button id="btnCreate">Criar contato</button>
      </div>
    </div>
    <div id="err" class="error"></div>
  </header>

  <main>
    <div class="col left">
      <div class="section-title">Outbox da empresa</div>
      <div class="section-body">
        <div id="outboxGlobalPanel" class="panel">
          <div class="muted">Carregue a empresa para visualizar a fila.</div>
        </div>
      </div>
      <div class="section-title">Conversas</div>
      <div style="overflow:auto">
        <ul id="conversas" class="list"></ul>
      </div>
    </div>
    <div class="col">
      <div id="chat" class="chat">
        <div class="muted">Selecione uma conversa.</div>
      </div>
      <div class="compose">
        <button id="btnRead" disabled>Marcar como lida</button>
        <input id="text" type="text" placeholder="Escreva uma mensagem…" disabled />
        <button id="btnSend" disabled>Enviar</button>
      </div>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    const apiKeyInput = $("apiKey");
    const empresaIdInput = $("empresaId");
    const btnLoad = $("btnLoad");
    const statusEl = $("status");
    const errEl = $("err");
    const conversasEl = $("conversas");
    const chatEl = $("chat");
    const btnSend = $("btnSend");
    const btnRead = $("btnRead");
    const textEl = $("text");
    const newTelefoneEl = $("newTelefone");
    const newNomeEl = $("newNome");
    const newTagsEl = $("newTags");
    const btnCreate = $("btnCreate");
    const outboxGlobalPanelEl = $("outboxGlobalPanel");

    let currentContatoId = null;
    let currentContato = null;

    // Auto-refresh (polling) da conversa selecionada
    const POLL_MESSAGES_MS = 2500;
    const POLL_CONVERSAS_MS = 8000;
    let pollTimer = null;
    let pollInFlight = false;
    let lastRenderedLastMessageId = null;
    let lastRenderedStateKey = null;
    let lastConversasRefreshAt = 0;
    let currentOutboxStatusFilter = "all";
    let lastGlobalOutboxKey = null;

    function setError(msg) {
      errEl.textContent = msg || "";
    }

    function setStatus(msg) {
      statusEl.textContent = msg || "";
    }

    function headers() {
      const key = String(apiKeyInput.value || "").trim();
      return key ? { "x-api-key": key, "Content-Type": "application/json" } : { "Content-Type": "application/json" };
    }

    async function apiGet(path) {
      const res = await fetch(path, { headers: headers() });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || `HTTP ${res.status}`);
      }
      return res.json();
    }

    async function apiPost(path, body) {
      const res = await fetch(path, { method: "POST", headers: headers(), body: JSON.stringify(body || {}) });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || `HTTP ${res.status}`);
      }
      return res.json();
    }

    async function apiPut(path, body) {
      const res = await fetch(path, { method: "PUT", headers: headers(), body: JSON.stringify(body || {}) });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || `HTTP ${res.status}`);
      }
      return res.json();
    }

    // Resolve URLs do painel (funciona local e em subpasta /wppsaas/api/admin/ui)
    function adminUrl(path) {
      const base = new URL(".", window.location.href); // .../api/admin/
      base.search = "";
      base.hash = "";
      const cleaned = String(path || "").replace(/^\/+/, "");
      return new URL(cleaned, base).toString();
    }

    // Resolve URLs para a API base (.../api/) derivando da base do admin (.../api/admin/)
    // Isso evita perder o prefixo /api quando a UI está em subpath (/wppsaas/...).
    function apiUrl(path) {
      const adminBase = new URL(".", window.location.href); // .../api/admin/
      adminBase.search = "";
      adminBase.hash = "";

      const base = new URL("../", adminBase); // .../api/
      const cleaned = String(path || "").replace(/^\/+/, "");
      return new URL(cleaned, base).toString();
    }

    function normalizeTelefone(raw) {
      const digits = String(raw || "").replace(/\D+/g, "");
      if (!digits) return "";
      if (digits.startsWith("55")) return digits;
      // DDD+numero (10/11) sem país
      if (digits.length === 10 || digits.length === 11) return `55${digits}`;
      // já veio com país mas sem 55 (ex.: outros) => mantém como está
      return digits;
    }

    function formatTelefoneDisplay(raw) {
      const digits = normalizeTelefone(raw);
      if (!digits) return "";
      const national = digits.startsWith("55") ? digits.slice(2) : digits;
      const ddd = national.slice(0, 2);
      const rest = national.slice(2);
      if (rest.length === 9) {
        return `+55 (${ddd}) ${rest.slice(0, 5)}-${rest.slice(5)}`;
      }
      if (rest.length === 8) {
        return `+55 (${ddd}) ${rest.slice(0, 4)}-${rest.slice(4)}`;
      }
      return digits.startsWith("55") ? `+${digits}` : digits;
    }

    function parseTags(raw, { empty = "null" } = {}) {
      const s = String(raw || "").trim();
      if (!s) return empty === "array" ? [] : null;
      const items = s
        .split(",")
        .map((t) => String(t).trim())
        .filter(Boolean);
      if (items.length) return items;
      return empty === "array" ? [] : null;
    }

    function tagsToString(tags) {
      if (!tags) return "";
      if (Array.isArray(tags)) return tags.filter(Boolean).join(", ");
      return String(tags);
    }

    function parseBotStatusDetails(raw) {
      if (!raw) return null;
      if (typeof raw === "object") return raw;
      const s = String(raw || "").trim();
      if (!s) return null;
      try {
        return JSON.parse(s);
      } catch {
        return { message: s };
      }
    }

    function formatBotStatus(contato) {
      let reason = String(contato?.bot_status_reason || "").trim();

      // Fallback: quando o status persistido ainda não existe (ou não pôde ser gravado),
      // exibimos o motivo efetivo com base no estado atual do contato.
      let computed = false;
      if (!reason) {
        const modo = String(contato?.atendimento_modo || "bot").toLowerCase();
        const pausadoAte = contato?.atendimento_pausado_ate
          ? new Date(contato.atendimento_pausado_ate)
          : null;
        const isPausado = pausadoAte && pausadoAte.getTime && pausadoAte.getTime() > Date.now();
        if (modo === "humano") {
          reason = "human_active";
          computed = true;
        } else if (isPausado) {
          reason = "paused";
          computed = true;
        }
      }

      if (!reason) return null;

      const details = computed
        ? { computed: true }
        : parseBotStatusDetails(contato?.bot_status_details || null);

      const at = computed
        ? (reason === "human_active" && contato?.ultimo_humano_em ? new Date(contato.ultimo_humano_em) : null)
        : (contato?.bot_status_at ? new Date(contato.bot_status_at) : null);

      let label = "";
      if (reason === "human_active") label = "Suprimido: humano ativo";
      else if (reason === "paused") label = "Suprimido: em pausa";
      else if (reason === "duplicate_wa_message_id") label = "Ignorado: duplicado";
      else if (reason === "outside_24h_window") {
        label = "Não enviado: fora da janela 24h";

        const outcome = details?.template?.outcome;
        if (outcome === "sent") label += " (template enviado)";
        else if (outcome === "not_configured") label += " (sem template)";
        else if (outcome === "failed") label += " (template falhou)";
      } else {
        label = `Status: ${reason}`;
      }

      return {
        reason,
        label,
        at,
        details,
      };
    }

    function renderConversas(items) {
      conversasEl.innerHTML = "";
      for (const c of items) {
        const li = document.createElement("li");
        li.className = "item" + (String(c.id) === String(currentContatoId) ? " active" : "");

        const title = document.createElement("div");
        const phone = formatTelefoneDisplay(c.telefone || "");
        title.textContent = c.nome ? `${c.nome} • ${phone || (c.telefone || "")}` : (phone || (c.telefone || ""));

        const subtitle = document.createElement("div");
        subtitle.className = "muted";
        const last = c.last_message_conteudo ? String(c.last_message_conteudo).slice(0, 60) : "(sem mensagens)";
        subtitle.textContent = last;

        const meta = document.createElement("div");
        meta.className = "row";
        meta.style.marginTop = "6px";

        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = c.unread_count ? `Não lidas: ${c.unread_count}` : "Ok";

        const modeBadge = document.createElement("span");
        modeBadge.className = "badge";
        const mode = String(c.atendimento_modo || "bot").toLowerCase();
        modeBadge.textContent = mode === "humano" ? "HUMANO" : "BOT";

        const botStatus = formatBotStatus(c);
        const botBadge = document.createElement("span");
        botBadge.className = "badge";
        botBadge.textContent = botStatus ? botStatus.label : "";

        meta.appendChild(badge);
        meta.appendChild(modeBadge);
        if (botStatus) meta.appendChild(botBadge);

        li.appendChild(title);
        li.appendChild(subtitle);
        li.appendChild(meta);

        li.addEventListener("click", () => selectContato(c.id));
        conversasEl.appendChild(li);
      }
    }

    function formatOutboxStatus(item) {
      const status = String(item?.status || "").trim() || "unknown";
      const providerStatus = String(item?.provider_status || "").trim();
      if (providerStatus) return `${status} • Meta: ${providerStatus}`;
      return status;
    }

    function describeQueueStatus(status) {
      const value = String(status || "").trim().toLowerCase();
      if (value === "failed") return { label: "Falha na fila", className: "status-failed" };
      if (value === "processing") return { label: "Em processamento", className: "status-processing" };
      if (value === "pending") return { label: "Aguardando envio", className: "status-pending" };
      if (value === "sent") return { label: "Enviado para Meta", className: "status-sent" };
      return { label: value || "Desconhecido", className: "" };
    }

    function describeProviderStatus(status) {
      const value = String(status || "").trim().toLowerCase();
      if (!value) return null;
      if (value === "sent") return { label: "Meta recebeu", className: "meta-sent" };
      if (value === "delivered") return { label: "Entregue ao cliente", className: "meta-delivered" };
      if (value === "read") return { label: "Cliente leu", className: "meta-read" };
      if (value === "failed") return { label: "Falha na Meta", className: "meta-failed" };
      return { label: `Meta: ${value}`, className: "" };
    }

    function renderStatusBadge({ label, className = "" }) {
      const span = document.createElement("span");
      span.className = `badge${className ? ` ${className}` : ""}`;
      span.textContent = label;
      return span;
    }

    function renderOutboxStatusRow(item) {
      const row = document.createElement("div");
      row.className = "status-row";

      row.appendChild(renderStatusBadge(describeQueueStatus(item?.status)));

      const provider = describeProviderStatus(item?.provider_status);
      if (provider) {
        row.appendChild(renderStatusBadge(provider));
      }

      return row;
    }

    function statusQueryValue(status) {
      return status && status !== "all" ? status : "";
    }

    function buildGlobalOutboxStateKey(payload, filter) {
      const summary = payload?.summary || {};
      const items = Array.isArray(payload?.items) ? payload.items : [];
      return JSON.stringify({
        filter,
        summary: {
          total: Number(summary.total || 0),
          pending: Number(summary.pending || 0),
          processing: Number(summary.processing || 0),
          failed: Number(summary.failed || 0),
          sent: Number(summary.sent || 0),
        },
        items: items.map((item) => [
          item.id,
          item.status,
          item.provider_status || null,
          item.contato_id || null,
          item.attempt_count || 0,
          item.next_retry_at || null,
        ]),
      });
    }

    function canRetryOutbox(item) {
      return item && item.status !== "sent";
    }

    async function retryOutboxItem(empresaId, itemId) {
      return apiPost(adminUrl(`empresas/${empresaId}/outbox/${itemId}/retry`));
    }

    function renderGlobalOutbox(payload, { filter = "all" } = {}) {
      outboxGlobalPanelEl.innerHTML = "";

      const summary = payload?.summary || {};
      const items = Array.isArray(payload?.items) ? payload.items : [];

      const header = document.createElement("div");
      header.className = "panel-header";
      header.innerHTML = `
        <h3 style="margin:0">Fila de envio</h3>
        <button id="btnRefreshOutbox" type="button">Atualizar</button>
      `;
      outboxGlobalPanelEl.appendChild(header);

      const summaryGrid = document.createElement("div");
      summaryGrid.className = "summary-grid";
      summaryGrid.innerHTML = `
        <div class="summary-card"><strong>${Number(summary.total || 0)}</strong><span class="muted">Total</span></div>
        <div class="summary-card"><strong>${Number(summary.pending || 0)}</strong><span class="muted">Pendentes</span></div>
        <div class="summary-card"><strong>${Number(summary.failed || 0)}</strong><span class="muted">Falhas</span></div>
        <div class="summary-card"><strong>${Number(summary.processing || 0)}</strong><span class="muted">Processando</span></div>
        <div class="summary-card"><strong>${Number(summary.sent || 0)}</strong><span class="muted">Enviadas</span></div>
      `;
      outboxGlobalPanelEl.appendChild(summaryGrid);

      const filters = [
        { id: "all", label: "Todas" },
        { id: "failed", label: "Falhas" },
        { id: "pending", label: "Pendentes" },
        { id: "processing", label: "Processando" },
        { id: "sent", label: "Enviadas" },
      ];

      const filterBar = document.createElement("div");
      filterBar.className = "filter-bar";
      for (const entry of filters) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "filter-chip" + (entry.id === filter ? " active" : "");
        btn.textContent = entry.label;
        btn.addEventListener("click", async () => {
          if (currentOutboxStatusFilter === entry.id) return;
          currentOutboxStatusFilter = entry.id;
          lastGlobalOutboxKey = null;
          try {
            setError("");
            setStatus("Carregando outbox…");
            await loadGlobalOutbox();
          } catch (e) {
            setError(e.message);
            setStatus("");
          }
        });
        filterBar.appendChild(btn);
      }
      outboxGlobalPanelEl.appendChild(filterBar);

      const btnRefreshOutbox = header.querySelector("#btnRefreshOutbox");
      btnRefreshOutbox.addEventListener("click", async () => {
        try {
          setError("");
          setStatus("Atualizando outbox…");
          lastGlobalOutboxKey = null;
          await loadGlobalOutbox();
        } catch (e) {
          setError(e.message);
          setStatus("");
        }
      });

      if (items.length === 0) {
        const empty = document.createElement("div");
        empty.className = "muted";
        empty.textContent =
          filter === "all"
            ? "Nenhum item na fila para esta empresa."
            : `Nenhum item com status "${filter}".`;
        outboxGlobalPanelEl.appendChild(empty);
        return;
      }

      for (const item of items) {
        const row = document.createElement("div");
        row.className = `outbox-global-item ${String(item.status || "").toLowerCase()}`;

        const contatoLabel = item.contato_id
          ? `Contato #${item.contato_id}`
          : "Sem contato";
        const phone = formatTelefoneDisplay(item.recipient || "") || item.recipient || "";
        const createdAt = item.created_at ? new Date(item.created_at).toLocaleString() : "";
        const nextRetryAt = item.next_retry_at ? new Date(item.next_retry_at).toLocaleString() : "";
        const processedAt = item.processed_at ? new Date(item.processed_at).toLocaleString() : "";
        const providerId = item.provider_message_id ? `Meta ID ${item.provider_message_id}` : "";

        row.innerHTML = `
          <div><strong>${escapeHtml(item.content || "(sem conteúdo)")}</strong></div>
          <div class="muted" style="margin-top:4px">${escapeHtml(contatoLabel)} • ${escapeHtml(phone)}</div>
          ${item.last_error ? `<div class="error" style="margin-top:6px">${escapeHtml(item.last_error)}</div>` : ""}
        `;

        row.appendChild(renderOutboxStatusRow(item));

        const timeline = document.createElement("div");
        timeline.className = "timeline-line";
        if (createdAt) {
          const created = document.createElement("span");
          created.className = "timeline-pill";
          created.textContent = `Criado ${createdAt}`;
          timeline.appendChild(created);
        }
        if (nextRetryAt && String(item.status || "").toLowerCase() !== "sent") {
          const retry = document.createElement("span");
          retry.className = "timeline-pill";
          retry.textContent = `Retry ${nextRetryAt}`;
          timeline.appendChild(retry);
        }
        if (processedAt) {
          const processed = document.createElement("span");
          processed.className = "timeline-pill";
          processed.textContent = `Processado ${processedAt}`;
          timeline.appendChild(processed);
        }
        if (providerId) {
          const provider = document.createElement("span");
          provider.className = "timeline-pill";
          provider.textContent = providerId;
          timeline.appendChild(provider);
        }
        row.appendChild(timeline);

        const meta = document.createElement("div");
        meta.className = "outbox-meta";

        if (item.contato_id) {
          const btnOpen = document.createElement("button");
          btnOpen.type = "button";
          btnOpen.textContent = "Abrir conversa";
          btnOpen.addEventListener("click", () => selectContato(item.contato_id));
          meta.appendChild(btnOpen);
        }

        if (canRetryOutbox(item)) {
          const btnRetry = document.createElement("button");
          btnRetry.type = "button";
          btnRetry.textContent = "Reenviar agora";
          btnRetry.addEventListener("click", async () => {
            const empresaId = Number(empresaIdInput.value || 0);
            btnRetry.disabled = true;
            try {
              setError("");
              setStatus("Reenviando item da outbox…");
              await retryOutboxItem(empresaId, item.id);
              await loadGlobalOutbox({ silent: true });
              if (currentContatoId && Number(currentContatoId) === Number(item.contato_id || 0)) {
                await refreshCurrent({ silent: true });
              }
              setStatus("Item reenviado");
            } catch (e) {
              setError(e.message);
              setStatus("");
            } finally {
              btnRetry.disabled = false;
            }
          });
          meta.appendChild(btnRetry);
        }

        row.appendChild(meta);
        outboxGlobalPanelEl.appendChild(row);
      }
    }

    function renderOutboxPanel(items, empresaId, contatoId) {
      const panel = document.createElement("div");
      panel.className = "panel";

      const title = document.createElement("h3");
      title.textContent = "Outbox recente";
      panel.appendChild(title);

      if (!Array.isArray(items) || items.length === 0) {
        const empty = document.createElement("div");
        empty.className = "muted";
        empty.textContent = "Nenhum item recente na fila para este contato.";
        panel.appendChild(empty);
        return panel;
      }

      for (const item of items) {
        const row = document.createElement("div");
        row.className = "outbox-item";

        const when = item.created_at ? new Date(item.created_at).toLocaleString() : "";
        const nextRetryAt = item.next_retry_at ? new Date(item.next_retry_at).toLocaleString() : "";
        const processedAt = item.processed_at ? new Date(item.processed_at).toLocaleString() : "";
        const providerId = item.provider_message_id ? `Meta ID ${item.provider_message_id}` : "";
        const errorLine = item.last_error ? `Erro: ${item.last_error}` : "";

        row.innerHTML = `
          <div><strong>${escapeHtml(item.content || "(sem conteúdo)")}</strong></div>
          <div class="muted">Tentativa ${Number(item.attempt_count || 0)}</div>
          ${errorLine ? `<div class="error" style="margin-top:6px">${escapeHtml(errorLine)}</div>` : ""}
        `;

        row.appendChild(renderOutboxStatusRow(item));

        const timeline = document.createElement("div");
        timeline.className = "timeline-line";
        if (when) {
          const created = document.createElement("span");
          created.className = "timeline-pill";
          created.textContent = `Criado ${when}`;
          timeline.appendChild(created);
        }
        if (nextRetryAt && String(item.status || "").toLowerCase() !== "sent") {
          const retry = document.createElement("span");
          retry.className = "timeline-pill";
          retry.textContent = `Retry ${nextRetryAt}`;
          timeline.appendChild(retry);
        }
        if (processedAt) {
          const processed = document.createElement("span");
          processed.className = "timeline-pill";
          processed.textContent = `Processado ${processedAt}`;
          timeline.appendChild(processed);
        }
        if (providerId) {
          const provider = document.createElement("span");
          provider.className = "timeline-pill";
          provider.textContent = providerId;
          timeline.appendChild(provider);
        }
        row.appendChild(timeline);

        const meta = document.createElement("div");
        meta.className = "outbox-meta";

        if (canRetryOutbox(item)) {
          const btnRetry = document.createElement("button");
          btnRetry.textContent = "Reenviar agora";
          btnRetry.addEventListener("click", async () => {
            btnRetry.disabled = true;
            try {
              setError("");
              setStatus("Reenviando item da outbox…");
              await retryOutboxItem(empresaId, item.id);
              await loadGlobalOutbox({ silent: true });
              await selectContato(contatoId);
              setStatus("Item reenviado");
            } catch (e) {
              setError(e.message);
              setStatus("");
            } finally {
              btnRetry.disabled = false;
            }
          });
          meta.appendChild(btnRetry);
        }

        row.appendChild(meta);
        panel.appendChild(row);
      }

      return panel;
    }

    async function loadGlobalOutbox({ silent = false } = {}) {
      const empresaId = Number(empresaIdInput.value || 0);
      if (!empresaId) throw new Error("Empresa ID inválido");

      const qs = new URLSearchParams({ limit: "30" });
      const status = statusQueryValue(currentOutboxStatusFilter);
      if (status) qs.set("status", status);

      const payload = await apiGet(
        adminUrl(`empresas/${empresaId}/outbox?${qs.toString()}`),
      );

      const nextKey = buildGlobalOutboxStateKey(
        payload,
        currentOutboxStatusFilter,
      );
      if (nextKey !== String(lastGlobalOutboxKey || "")) {
        lastGlobalOutboxKey = nextKey;
        renderGlobalOutbox(payload, { filter: currentOutboxStatusFilter });
      }

      if (!silent) {
        const count = Array.isArray(payload?.items) ? payload.items.length : 0;
        setStatus(`Outbox: ${count} item(ns)`);
      }

      return payload;
    }

    function renderChat(payload, outboxItems = []) {
      chatEl.innerHTML = "";

      currentContato = payload.contato;

      const head = document.createElement("div");
      head.className = "row";

      const displayPhone = formatTelefoneDisplay(payload.contato.telefone || "") || payload.contato.telefone || "";
      const safeName = escapeHtml(payload.contato.nome || "");
      const safeTags = escapeHtml(tagsToString(payload.contato.tags || null));

      const botStatus = formatBotStatus(payload.contato);
      const botLine = botStatus
        ? `Último motivo do bot: ${escapeHtml(botStatus.label)}${botStatus.at ? ` • ${botStatus.at.toLocaleString()}` : ""}`
        : "";

      head.innerHTML = `
        <div style="flex:1">
          <div><strong>${safeName || escapeHtml(displayPhone)}</strong></div>
          <div class="muted">${escapeHtml(displayPhone)} • Contato #${payload.contato.id}</div>
          ${botLine ? `<div class="muted" style="margin-top:6px">${botLine}</div>` : ""}
          <div class="row" style="margin-top:8px">
            <div>
              <label>Nome</label><br />
              <input id="editNome" type="text" value="${safeName}" size="22" />
            </div>
            <div>
              <label>Tags</label><br />
              <input id="editTags" type="text" value="${safeTags}" size="26" placeholder="vip, orçamento" />
            </div>
            <div style="padding-top:18px">
              <button id="btnSaveContato">Salvar contato</button>
            </div>
          </div>

          <div class="row" style="margin-top:10px">
            <span class="badge" id="attBadge">—</span>
            <button id="btnAssumir">Assumir atendimento</button>
            <button id="btnDevolver">Devolver para bot</button>
            <button id="btnDebug">Debug</button>
          </div>
        </div>
      `;

      chatEl.appendChild(head);
      chatEl.appendChild(
        renderOutboxPanel(
          outboxItems,
          Number(empresaIdInput.value || 0),
          payload.contato.id,
        ),
      );

      const btnSaveContato = head.querySelector("#btnSaveContato");
      const editNome = head.querySelector("#editNome");
      const editTags = head.querySelector("#editTags");
      const attBadge = head.querySelector("#attBadge");
      const btnAssumir = head.querySelector("#btnAssumir");
      const btnDevolver = head.querySelector("#btnDevolver");
      const btnDebug = head.querySelector("#btnDebug");

      (function applyAtendimentoState() {
        const modo = String(payload?.contato?.atendimento_modo || "bot").toLowerCase();
        const pausadoAte = payload?.contato?.atendimento_pausado_ate ? new Date(payload.contato.atendimento_pausado_ate) : null;
        const isPausado = pausadoAte && pausadoAte.getTime && pausadoAte.getTime() > Date.now();

        let label = modo === "humano" ? "HUMANO" : "BOT";
        if (modo !== "humano" && isPausado) {
          label += ` (pausado até ${pausadoAte.toLocaleString()})`;
        }

        attBadge.textContent = label;
        btnAssumir.disabled = modo === "humano";
        btnDevolver.disabled = modo !== "humano";
      })();

      btnAssumir.addEventListener("click", async () => {
        try {
          setError("");
          setStatus("Assumindo atendimento…");
          const empresaId = Number(empresaIdInput.value || 0);
          if (!empresaId) throw new Error("Empresa ID inválido");
          await apiPost(adminUrl(`empresas/${empresaId}/conversas/${payload.contato.id}/assumir`));
          await selectContato(payload.contato.id);
          setStatus("Atendimento assumido");
        } catch (e) {
          setError(e.message);
          setStatus("");
        }
      });

      btnDevolver.addEventListener("click", async () => {
        try {
          setError("");
          setStatus("Devolvendo para bot…");
          const empresaId = Number(empresaIdInput.value || 0);
          if (!empresaId) throw new Error("Empresa ID inválido");
          await apiPost(adminUrl(`empresas/${empresaId}/conversas/${payload.contato.id}/devolver`));
          await selectContato(payload.contato.id);
          setStatus("Devolvido para bot");
        } catch (e) {
          setError(e.message);
          setStatus("");
        }
      });

      btnDebug.addEventListener("click", async () => {
        try {
          setError("");
          setStatus("Carregando debug…");

          const empresaId = Number(empresaIdInput.value || 0);
          if (!empresaId) throw new Error("Empresa ID inválido");
          const contatoId = payload?.contato?.id;
          if (!contatoId) throw new Error("Contato inválido");

          const debugPayload = await apiGet(
            adminUrl(`empresas/${empresaId}/conversas/${contatoId}/debug`),
          );

          const w = window.open("", "_blank");
          if (!w) throw new Error("Pop-up bloqueado pelo navegador");

          const title = `Debug • Empresa ${empresaId} • Contato ${contatoId}`;
          const json = JSON.stringify(debugPayload, null, 2);

          w.document.open();
          w.document.write(
            `<!doctype html><html lang="pt-br"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>${escapeHtml(title)}</title></head><body style="margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;"><div style="padding:12px 16px;border-bottom:1px solid #ddd;"><strong>${escapeHtml(title)}</strong></div><pre style="margin:0;padding:12px 16px;white-space:pre-wrap;word-break:break-word;">${escapeHtml(json)}</pre></body></html>`,
          );
          w.document.close();

          setStatus("Debug aberto");
        } catch (e) {
          setError(e.message);
          setStatus("");
        }
      });

      btnSaveContato.addEventListener("click", async () => {
        try {
          setError("");
          setStatus("Salvando contato…");

          const empresaId = Number(empresaIdInput.value || 0);
          if (!empresaId) throw new Error("Empresa ID inválido");
          const nomeRaw = String(editNome.value || "");
          const nome = nomeRaw.trim() === "" ? "" : nomeRaw.trim();
          const tags = parseTags(editTags.value || "", { empty: "array" });

          await apiPut(apiUrl(`empresas/${empresaId}/contatos/${payload.contato.id}`), {
            nome,
            tags,
          });

          await selectContato(payload.contato.id);
          setStatus("Contato salvo");
        } catch (e) {
          setError(e.message);
          setStatus("");
        }
      });

      for (const m of payload.mensagens) {
        const div = document.createElement("div");
        div.className = "msg " + (m.direcao === "entrada" ? "in" : "out");
        const when = m.created_at ? new Date(m.created_at).toLocaleString() : "";
        div.innerHTML = `<div>${escapeHtml(m.conteudo || "")}</div><div class="muted" style="margin-top:6px">${m.direcao} • ${when}</div>`;
        chatEl.appendChild(div);
      }
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function loadConversas() {
      setError("");
      setStatus("Carregando conversas…");

      const empresaId = Number(empresaIdInput.value || 0);
      if (!empresaId) throw new Error("Empresa ID inválido");

      const data = await apiGet(adminUrl(`empresas/${empresaId}/conversas?limit=100`));
      renderConversas(data);
      await loadGlobalOutbox({ silent: true });
      setStatus(`Conversas: ${data.length}`);
    }

    function startPolling() {
      if (pollTimer) return;
      pollTimer = setInterval(() => {
        refreshCurrent({ silent: true }).catch(() => {
          // best-effort
        });
      }, POLL_MESSAGES_MS);
    }

    function stopPolling() {
      if (!pollTimer) return;
      clearInterval(pollTimer);
      pollTimer = null;
    }

    async function refreshCurrent({ silent = false } = {}) {
      if (!currentContatoId) return;
      if (document.hidden) return;
      if (pollInFlight) return;

      const empresaId = Number(empresaIdInput.value || 0);
      if (!empresaId) return;

      pollInFlight = true;
      try {
        const [payload, outboxPayload] = await Promise.all([
          apiGet(
            adminUrl(
              `empresas/${empresaId}/conversas/${currentContatoId}/mensagens?order=asc&limit=200`,
            ),
          ),
          apiGet(
            adminUrl(`empresas/${empresaId}/outbox?contatoId=${currentContatoId}&limit=10`),
          ),
        ]);

        const msgs = Array.isArray(payload?.mensagens) ? payload.mensagens : [];
        const outboxItems = Array.isArray(outboxPayload?.items)
          ? outboxPayload.items
          : [];
        const lastId = msgs.length ? String(msgs[msgs.length - 1]?.id || "") : "";
        const renderStateKey = JSON.stringify({
          lastMessageId: lastId || null,
          contato: {
            modo: payload?.contato?.atendimento_modo || null,
            pausado: payload?.contato?.atendimento_pausado_ate || null,
            botReason: payload?.contato?.bot_status_reason || null,
            botAt: payload?.contato?.bot_status_at || null,
          },
          outbox: outboxItems.map((item) => [
            item.id,
            item.status,
            item.provider_status || null,
            item.attempt_count || 0,
            item.next_retry_at || null,
          ]),
        });

        // Re-renderiza quando muda mensagem, estado do contato ou estado da outbox.
        if (renderStateKey !== String(lastRenderedStateKey || "")) {
          lastRenderedLastMessageId = lastId || null;
          lastRenderedStateKey = renderStateKey;
          renderChat(payload, outboxItems);
        }

        const now = Date.now();
        if (!lastConversasRefreshAt || now - lastConversasRefreshAt > POLL_CONVERSAS_MS) {
          lastConversasRefreshAt = now;
          const [conversas] = await Promise.all([
            apiGet(adminUrl(`empresas/${empresaId}/conversas?limit=100`)),
            loadGlobalOutbox({ silent: true }),
          ]);
          renderConversas(conversas);
        }

        if (!silent) setStatus("OK");
      } catch (e) {
        // Se a chave expirar/ficar inválida, vale mostrar erro (mas sem spam durante polling)
        if (!silent) {
          setError(e.message);
          setStatus("");
        }
      } finally {
        pollInFlight = false;
      }
    }

    async function selectContato(contatoId) {
      currentContatoId = contatoId;
      currentContato = null;
      btnSend.disabled = false;
      btnRead.disabled = false;
      textEl.disabled = false;

      // reseta marcador para forçar render na primeira carga
      lastRenderedLastMessageId = null;

      setError("");
      setStatus("Carregando mensagens…");

      const empresaId = Number(empresaIdInput.value || 0);
      const [payload, conversas, outboxPayload] = await Promise.all([
        apiGet(adminUrl(`empresas/${empresaId}/conversas/${contatoId}/mensagens?order=asc&limit=200`)),
        apiGet(adminUrl(`empresas/${empresaId}/conversas?limit=100`)),
        apiGet(adminUrl(`empresas/${empresaId}/outbox?contatoId=${contatoId}&limit=10`)),
      ]);
      const msgs = Array.isArray(payload?.mensagens) ? payload.mensagens : [];
      const outboxItems = Array.isArray(outboxPayload?.items) ? outboxPayload.items : [];
      lastRenderedLastMessageId = msgs.length ? String(msgs[msgs.length - 1]?.id || "") : null;
      lastRenderedStateKey = JSON.stringify({
        lastMessageId: lastRenderedLastMessageId,
        contato: {
          modo: payload?.contato?.atendimento_modo || null,
          pausado: payload?.contato?.atendimento_pausado_ate || null,
          botReason: payload?.contato?.bot_status_reason || null,
          botAt: payload?.contato?.bot_status_at || null,
        },
        outbox: outboxItems.map((item) => [
          item.id,
          item.status,
          item.provider_status || null,
          item.attempt_count || 0,
          item.next_retry_at || null,
        ]),
      });
      renderChat(payload, outboxItems);
      renderConversas(conversas);

      setStatus("OK");

      startPolling();
    }

    async function send() {
      const empresaId = Number(empresaIdInput.value || 0);
      const text = String(textEl.value || "").trim();
      if (!text) return;
      if (!currentContatoId) return;

      btnSend.disabled = true;
      setError("");
      setStatus("Enviando…");

      try {
        await apiPost(adminUrl(`empresas/${empresaId}/conversas/${currentContatoId}/send`), { text });
        textEl.value = "";
        await selectContato(currentContatoId);
        setStatus("Enviado");
      } catch (e) {
        setError(e.message);
        setStatus("");
      } finally {
        btnSend.disabled = false;
      }
    }

    async function markRead() {
      const empresaId = Number(empresaIdInput.value || 0);
      if (!currentContatoId) return;

      btnRead.disabled = true;
      setError("");
      setStatus("Marcando como lida…");

      try {
        await apiPost(adminUrl(`empresas/${empresaId}/conversas/${currentContatoId}/read`));
        await selectContato(currentContatoId);
        setStatus("Lida");
      } catch (e) {
        setError(e.message);
        setStatus("");
      } finally {
        btnRead.disabled = false;
      }
    }

    btnLoad.addEventListener("click", async () => {
      try {
        localStorage.setItem("ADMIN_API_KEY", String(apiKeyInput.value || ""));
        localStorage.setItem("EMPRESA_ID", String(empresaIdInput.value || ""));
        await loadConversas();
      } catch (e) {
        setError(e.message);
        setStatus("");
      }
    });

    btnCreate.addEventListener("click", async () => {
      try {
        setError("");
        setStatus("Criando contato…");

        const empresaId = Number(empresaIdInput.value || 0);
        if (!empresaId) throw new Error("Empresa ID inválido");

        const telefoneNorm = normalizeTelefone(newTelefoneEl.value);
        if (!telefoneNorm) throw new Error("Telefone é obrigatório");
        if (telefoneNorm.length < 12) throw new Error("Telefone inválido");

        const nome = String(newNomeEl.value || "").trim() || null;
        const tags = parseTags(newTagsEl.value || "", { empty: "null" });

        const contato = await apiPost(apiUrl(`empresas/${empresaId}/contatos`), {
          nome,
          telefone: telefoneNorm,
          tags,
        });

        newTelefoneEl.value = "";
        newNomeEl.value = "";
        newTagsEl.value = "";

        await loadConversas();
        await selectContato(contato.id);
        setStatus("Contato criado");
      } catch (e) {
        setError(e.message);
        setStatus("");
      }
    });

    btnSend.addEventListener("click", send);
    btnRead.addEventListener("click", markRead);
    textEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") send();
    });

    (function init() {
      const url = new URL(window.location.href);
      const key = url.searchParams.get("key");

      apiKeyInput.value = key || localStorage.getItem("ADMIN_API_KEY") || "";
      empresaIdInput.value = localStorage.getItem("EMPRESA_ID") || "1";

      if (key) {
        url.searchParams.delete("key");
        history.replaceState(null, "", url.toString());
      }
    })();

    // Atualiza assim que o usuário volta pra aba
    window.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        refreshCurrent({ silent: true }).catch(() => {
          // best-effort
        });
      }
    });

    // Máscara simples para o input de telefone (somente visual)
    newTelefoneEl.addEventListener("blur", () => {
      const digits = String(newTelefoneEl.value || "").replace(/\D+/g, "");
      if (!digits) return;
      newTelefoneEl.value = formatTelefoneDisplay(digits);
    });
  </script>
</body>

</html>
